services:
  postgres:
    image: postgres:16-alpine
    container_name: bekachat-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-bekadb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bekachat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: bekachat:latest
    container_name: bekachat-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_NAME: ${DB_NAME:-bekadb}
      DB_HOST: postgres
      DB_PORT: 5432
      
      # Backend
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-supersecret123}
      
      # Vite (Frontend)
      VITE_HOST: 0.0.0.0
      VITE_PORT: 80
    ports:
      - "80:80"
      - "3001:3001"
    volumes:
      - ./src:/app/src
      - ./server:/app/server
      - ./uploads:/app/uploads
    networks:
      - bekachat-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bekachat-network:
    driver: bridge
